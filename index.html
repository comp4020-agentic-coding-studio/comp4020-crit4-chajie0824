<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>编钟绕梁</title>
    <meta
      name="description"
      content="一件可以自由弹奏的青铜编钟乐器：拖动可连奏滑音，力度和敲击位置决定音色，一键播放或跟着提示敲完《山止川行》的前奏。"
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
      <h1>编钟绕梁</h1>
      <p class="subtitle">拖动、按力敲击，或用键盘弹一段编钟</p>
    </header>
    <main>
      <div class="stage" id="stage">
        <canvas id="bells" role="img" aria-label="一组悬挂的青铜编钟，可用鼠标、触摸或键盘敲击演奏">
          你的浏览器不支持 Canvas，无法显示这件编钟乐器。
        </canvas>
        <div class="readout" id="readout" aria-live="polite"></div>
      </div>
      <div class="hint-panel">
        <div class="hint-buttons">
          <select id="songSelect" aria-label="选择曲目">
            <option value="shanzhichuanxing">山止川行</option>
            <option value="tiandihuanhuan">天地缓缓</option>
            <option value="oulesong">欢乐颂</option>
            <option value="qianqiu">千秋</option>
          </select>
          <button type="button" id="playToggle" aria-pressed="false">▶ 播放《山止川行》</button>
          <button type="button" id="hintToggle" aria-pressed="false">🔔 跟着弹</button>
        </div>
        <div class="hint-next" id="hintNext" aria-live="polite" hidden></div>
        <div class="hint-strip" id="hintStrip" hidden></div>
      </div>
      <p class="footer-note">
        拖过几口钟能连奏出滑音；敲在钟的正中是「正鼓音」，偏向钟边是「侧鼓音」，两者相差一个小三度——真正的编钟就是这样一钟两音的。
        键盘 <code>Q W E R T Y U I O P A S D F G H J</code> 对应从低到高每一口钟。上方一排小钟是钮钟，只作陈设，不发声。
        先选一首曲子，点「播放」直接听一遍前奏；点「跟着弹」会用光圈标出下一口该敲的钟，提示区的字母就是该按的键。
      </p>
      <p class="credit-note">
        钟声取自武汉音乐学院仿曾侯乙编钟采样音源（聂凯文录制，非商业使用），部分音高由邻近采样按半音差移调而成。
      </p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
